name: Expand audited project source

on:
  push:
    branches:
      - audited-meena-events-v2
    paths:
      - upload-chunks/part-07.b64

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: audited-meena-events-v2
          fetch-depth: 0

      - name: Expand the uploaded project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/meena-upload"
          cat upload-chunks/*.b64 | base64 --decode > "$RUNNER_TEMP/meena-events-audited.tar.gz"
          tar -xzf "$RUNNER_TEMP/meena-events-audited.tar.gz" -C "$RUNNER_TEMP/meena-upload"
          cp -a "$RUNNER_TEMP/meena-upload/meena-events/." .
          rm -rf upload-chunks

      - name: Commit application source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: add audited Meena Events website source [skip ci]"
          git push origin HEAD:audited-meena-events-v2
