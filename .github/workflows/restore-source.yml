name: Restore Meena Events app structure
on:
  push:
    branches:
      - main
    paths:
      - meena-events-source-ready.zip
      - .github/workflows/restore-source.yml
      - app/contact/page.tsx
      - tsconfig.json
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore source folders if not already present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app/page.tsx ]; then
            mkdir -p "$RUNNER_TEMP/meena-source"
            unzip -q meena-events-source-ready.zip -d "$RUNNER_TEMP/meena-source"
            test -f "$RUNNER_TEMP/meena-source/app/page.tsx"
            cp -a "$RUNNER_TEMP/meena-source/." .
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app components config lib public package.json package-lock.json next.config.mjs postcss.config.mjs tsconfig.json .gitignore README.md
            git commit -m "fix: restore Next.js source folder structure [skip ci]"
            git push origin HEAD:main
          fi
      - name: Install and verify production build
        run: |
          npm ci
          npm run build
